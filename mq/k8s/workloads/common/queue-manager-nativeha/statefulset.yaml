# Native HA queue manager, plain Kubernetes (no IBM MQ Operator, no Helm).
# Derived from the IBM sample chart ibm-messaging/mq-helm (charts/ibm-mq 14.0.0, Apache-2.0)
# rendered with queueManager.nativeha.enable=true.
#
# Names are generic here. Each queue manager's base sets namePrefix, and the
# components/qm-naming component rewrites every value that embeds the final name
# (replica addresses, pod-name selectors). Do not rename things here without
# updating that component.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ibm-mq
  labels:
    app.kubernetes.io/name: ibm-mq
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ibm-mq
  serviceName: ibm-mq
  podManagementPolicy: Parallel
  # Native HA: never RollingUpdate. A rolling update waits for each pod to be Ready,
  # but only the active pod is ever Ready, so it would stall. Pods are recycled by
  # scripts/rolling-restart.sh after a sync.
  updateStrategy:
    type: OnDelete
  # Must stay 3. It switches Native HA on together with MQ_NATIVE_HA below.
  replicas: 3
  template:
    metadata:
      annotations:
        # License annotations. Values depend on IIC's entitlement: set per environment in the overlay.
        productName: "IBM MQ for Non-Production Environment"
        productID: "151bec68564a4a47a14e6fa99266deff"
        productMetric: "VIRTUAL_PROCESSOR_CORE"
        productChargedContainers: qmgr
      labels:
        app.kubernetes.io/name: ibm-mq
        statefulSetName: NAME
    spec:
      serviceAccountName: ibm-mq
      imagePullSecrets:
        - name: ibm-entitlement-key
      securityContext:
        fsGroup: 0
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: statefulSetName
                    operator: In
                    values:
                      - NAME
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["amd64"]
                  - key: kubernetes.io/os
                    operator: In
                    values: ["linux"]
                  # MQ node pool (REQ-INF-002)
                  - key: workload
                    operator: In
                    values: ["ibm-mq"]
      tolerations:
        - key: workload
          operator: Equal
          value: ibm-mq
        - key: dedicated
          operator: Equal
          value: ibm-mq
          effect: NoSchedule
      # Spread the 3 replicas across zones (REQ-INF-009). Dev uses a single zone: the overlay may remove this.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ibm-mq
      volumes:
        - name: mqsc
          configMap:
            name: mqsc            # generated per queue manager; Kustomize rewrites the name
            defaultMode: 420
      containers:
        - name: qmgr
          image: cp.icr.io/cp/ibm-mqadvanced-server@sha256:06f0892b36e879d0f8957477deeabfe2b4e0fda13f64792edbe7825caf7b77e3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1414
            - containerPort: 9443
            - containerPort: 9157
            - containerPort: 9414
          env:
            - name: LICENSE
              value: accept
            - name: MQ_QMGR_NAME
              value: QMNAME        # set in each queue manager's base
            - name: MQ_NATIVE_HA
              value: "true"
            - name: MQ_NATIVE_HA_INSTANCE_0_NAME
              value: NAME-0
            - name: MQ_NATIVE_HA_INSTANCE_0_REPLICATION_ADDRESS
              value: NAME-replica-0(9414)
            - name: MQ_NATIVE_HA_INSTANCE_1_NAME
              value: NAME-1
            - name: MQ_NATIVE_HA_INSTANCE_1_REPLICATION_ADDRESS
              value: NAME-replica-1(9414)
            - name: MQ_NATIVE_HA_INSTANCE_2_NAME
              value: NAME-2
            - name: MQ_NATIVE_HA_INSTANCE_2_REPLICATION_ADDRESS
              value: NAME-replica-2(9414)
            - name: AMQ_CONTAINER_LICENSING
              value: "true"
            - name: MQ_LOGGING_CONSOLE_FORMAT
              value: basic
            - name: MQ_ENABLE_METRICS
              value: "true"
            - name: MQ_EPHEMERAL_PREFIX
              value: /run/mqm
            - name: MQ_GRACE_PERIOD
              value: "29"
          volumeMounts:
            # The container loads every /etc/mqm/*.mqsc at startup
            - name: mqsc
              mountPath: /etc/mqm/qm.mqsc
              subPath: qm.mqsc
              readOnly: true
            - name: qm
              mountPath: /mnt/mqm
            - name: data
              mountPath: /mnt/mqm-data
            - name: log
              mountPath: /mnt/mqm-log
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command: [chkmqhealthy]
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [chkmqready]
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          startupProbe:
            exec:
              command: [chkmqstarted]
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 24
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  # One set of three volumes per pod. MQ replicates between them.
  # Storage class: managed-csi-premium-cmk (Azure CSI Premium SSD with Customer-Managed Keys)
  volumeClaimTemplates:
    - metadata:
        name: qm
      spec:
        storageClassName: managed-csi-premium-cmk
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: data
      spec:
        storageClassName: managed-csi-premium-cmk
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: log
      spec:
        storageClassName: managed-csi-premium-cmk
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
