# Environment-level Azure Key Vault configuration for perf / cus.
# Include alongside workloads/common/components/keyvault-secrets in any perf/cus queue manager overlay.
# Populate the TBD values below once before enabling Key Vault CSI on perf queue managers.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: SecretProviderClass
    patch: |-
      - op: replace
        path: /spec/parameters/keyvaultName
        value: TBD-perf-keyvault-name
      - op: replace
        path: /spec/parameters/tenantId
        value: TBD-azure-tenant-id
      - op: replace
        path: /spec/parameters/userAssignedIdentityID
        value: TBD-aks-kv-addon-identity-client-id
