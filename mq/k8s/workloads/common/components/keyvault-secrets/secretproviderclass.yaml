# Syncs Azure Key Vault secrets or certificates into the queue manager pod (and optional K8s Secret).
# - metadata.name and secretName are rewritten per queue manager (<qm>-ibm-mq-kv) by kustomization.yaml.
# - keyvaultName, tenantId, and userAssignedIdentityID are patched once per environment by
#   workloads/common/components/keyvault-env/<env>/<region>.
# - Patch spec.parameters.objects (and spec.secretObjects, if used) in the queue manager's overlay
#   for queue-manager-specific Key Vault secret or certificate names.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: QM-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: TBD-set-in-keyvault-env
    keyvaultName: TBD-set-in-keyvault-env
    tenantId: TBD-set-in-keyvault-env
    objects: |
      array:
        - |
          objectName: TBD-secret-name
          objectType: secret
  secretObjects:
    - secretName: QM-kv
      type: Opaque
      data:
        - objectName: TBD-secret-name
          key: secret-value
