# Mounts the Key Vault CSI volume into the queue manager container.
# The Secrets Store CSI driver only syncs secretObjects while a pod mounts this volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: not-used   # matched by target labelSelector in kustomization.yaml
spec:
  template:
    spec:
      containers:
        - name: qmgr
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: QM-kv   # replaced with <qm>-ibm-mq-kv
