# Queue manager identity and MQSC component for QM_G4_Q.
#   folder name = Argo CD Application name = Kubernetes resource name prefix (qm-g4-q)
#   MQ queue manager name = QM_G4_Q
# Included as a Component by every environment overlay so dev can use single-instance
# while test, qa, perf, and prod use Native HA without duplicating MQSC or identity config.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

namePrefix: qm-g4-q-

# Per-queue-manager label, added to every selector and pod label so the Service selects only
# this queue manager's pod(s).
labels:
  - pairs:
      app.kubernetes.io/instance: qm-g4-q
    includeSelectors: true
    includeTemplates: true

# The hash suffix stays on, so a changed MQSC changes the pod template and triggers a rollout.
configMapGenerator:
  - name: mqsc
    files:
      - qm.mqsc=mqsc/qm.mqsc

patches:
  - target:
      kind: StatefulSet
      name: ibm-mq
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: ibm-mq
      spec:
        template:
          spec:
            containers:
              - name: qmgr
                env:
                  - name: MQ_QMGR_NAME
                    value: QM_G4_Q
