# Queue manager identity and MQSC component for OPF_UAT_Q.
#   folder name = Argo CD Application name = Kubernetes resource name prefix (opf-uat-q)
#   MQ queue manager name = OPF_UAT_Q
# Included as a Component by every environment overlay so dev can use single-instance
# while test, qa, perf, and prod use Native HA without duplicating MQSC or identity config.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

namePrefix: opf-uat-q-

# Per-queue-manager label, added to every selector and pod label so the Service selects only
# this queue manager's pod(s).
labels:
  - pairs:
      app.kubernetes.io/instance: opf-uat-q
    includeSelectors: true
    includeTemplates: true

# The hash suffix stays on, so a changed MQSC changes the pod template and triggers a rollout.
configMapGenerator:
  - name: mqsc
    files:
      - qm.mqsc=mqsc/qm.mqsc

patches:
  - target:
      kind: StatefulSet
      name: ibm-mq
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: ibm-mq
      spec:
        template:
          spec:
            containers:
              - name: qmgr
                env:
                  - name: MQ_QMGR_NAME
                    value: OPF_UAT_Q
