apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../base
patches:
- target:
    kind: AppProject
  patch: "- op: replace\n  path: /metadata/name\n  value: mq-ocp-dev-cus\n- op: replace\n  path: /spec/destinations/0/namespace\n\
    \  value: mq-ocp-dev\n- op: add\n  path: /spec/roles\n  value:\n  - name: mq-admins\n    description: Bind approved\
    \ IIC groups here; empty by default.\n    policies:\n    - p, proj:mq-ocp-dev-cus:mq-admins, applications, get,\
    \ mq-ocp-dev-cus/*, allow\n    - p, proj:mq-ocp-dev-cus:mq-admins, logs, get, mq-ocp-dev-cus/*, allow\n    -\
    \ p, proj:mq-ocp-dev-cus:mq-admins, applications, sync, mq-ocp-dev-cus/*, allow\n    - p, proj:mq-ocp-dev-cus:mq-admins,\
    \ applications, update, mq-ocp-dev-cus/*, allow\n    groups: []\n"
- target:
    kind: ApplicationSet
  patch: "- op: replace\n  path: /metadata/name\n  value: mq-ocp-dev-cus\n- op: replace\n  path: /spec/generators/0/git/directories/0/path\n\
    \  value: mq/ocp/workloads/mqm/*/overlays/dev/cus\n- op: replace\n  path: /spec/template/metadata/name\n  value:\
    \ '{{ index .path.segments (sub (len .path.segments) 4) }}-ocp-dev-cus'\n- op: replace\n  path: /spec/template/metadata/labels/environment\n\
    \  value: dev\n- op: replace\n  path: /spec/template/spec/project\n  value: mq-ocp-dev-cus\n- op: replace\n\
    \  path: /spec/template/spec/destination/namespace\n  value: mq-ocp-dev\n"
