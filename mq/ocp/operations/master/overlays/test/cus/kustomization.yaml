apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../base
patches:
- target:
    kind: AppProject
  patch: "- op: replace\n  path: /metadata/name\n  value: mq-ocp-test-cus\n- op: replace\n  path: /spec/destinations/0/namespace\n\
    \  value: mq-ocp-test\n- op: add\n  path: /spec/roles\n  value:\n  - name: mq-admins\n    description: Bind\
    \ approved IIC groups here; empty by default.\n    policies:\n    - p, proj:mq-ocp-test-cus:mq-admins, applications,\
    \ get, mq-ocp-test-cus/*, allow\n    - p, proj:mq-ocp-test-cus:mq-admins, logs, get, mq-ocp-test-cus/*, allow\n\
    \    groups: []\n"
- target:
    kind: ApplicationSet
  patch: "- op: replace\n  path: /metadata/name\n  value: mq-ocp-test-cus\n- op: replace\n  path: /spec/generators/0/git/directories/0/path\n\
    \  value: mq/ocp/workloads/mqm/*/overlays/test/cus\n- op: replace\n  path: /spec/template/metadata/name\n  value:\
    \ '{{ index .path.segments (sub (len .path.segments) 4) }}-ocp-test-cus'\n- op: replace\n  path: /spec/template/metadata/labels/environment\n\
    \  value: test\n- op: replace\n  path: /spec/template/spec/project\n  value: mq-ocp-test-cus\n- op: replace\n\
    \  path: /spec/template/spec/destination/namespace\n  value: mq-ocp-test\n- op: remove\n  path: /spec/template/spec/syncPolicy/automated\n"
