# Per-pod estimates copied from mq/k8s; customize after workload testing.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- target:
    kind: QueueManager
  patch: "- op: replace\n  path: /spec/queueManager/resources/requests/cpu\n  value: '2'\n- op: replace\n  path:\
    \ /spec/queueManager/resources/requests/memory\n  value: 4Gi\n- op: replace\n  path: /spec/queueManager/resources/limits/cpu\n\
    \  value: '4'\n- op: replace\n  path: /spec/queueManager/resources/limits/memory\n  value: 8Gi\n- op: replace\n\
    \  path: /spec/queueManager/storage/queueManager/size\n  value: 10Gi\n- op: replace\n  path: /spec/queueManager/storage/persistedData/size\n\
    \  value: 64Gi\n- op: replace\n  path: /spec/queueManager/storage/recoveryLogs/size\n  value: 32Gi\n- op: replace\n\
    \  path: /spec/license/license\n  value: L-CXDB-XTZ9J8\n- op: replace\n  path: /spec/license/use\n  value: Production\n\
    - op: add\n  path: /spec/affinity/podAntiAffinity/requiredDuringSchedulingIgnoredDuringExecution/-\n  value:\n\
    \    labelSelector:\n      matchLabels:\n        queueManagerIdentity: QM_ID\n    topologyKey: topology.kubernetes.io/zone\n"
