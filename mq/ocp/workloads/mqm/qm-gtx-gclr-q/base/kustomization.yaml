# Logical MQ name: QM_GTX_GCLR_Q; namespace-scoped CR name: qm-gtx-gclr-q-qm.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
namePrefix: qm-gtx-gclr-q-
labels:
- pairs:
    app.kubernetes.io/instance: qm-gtx-gclr-q
  includeSelectors: false
configMapGenerator:
- name: mqsc
  files:
  - qm.mqsc=mqsc/qm.mqsc
  - dev-connectivity.mqsc=mqsc/dev-connectivity.mqsc
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: '-1'
patches:
- target:
    kind: QueueManager
  patch: "- op: replace\n  path: /spec/queueManager/name\n  value: QM_GTX_GCLR_Q\n"
