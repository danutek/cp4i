apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../../../common/queue-manager-nativeha
namespace: mq-ocp-qa
components:
- ../../../base
- ../../../../../common/components/env-sizing/qa
- ../../../../../common/components/operator-references
labels:
- pairs:
    environment: qa
    region: cus
  includeSelectors: false
replacements:
- source:
    kind: QueueManager
    name: qm
    fieldPath: metadata.name
  targets:
  - select:
      kind: QueueManager
      name: qm
    fieldPaths:
    - spec.labels.queueManagerIdentity
    - spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.0.labelSelector.matchLabels.queueManagerIdentity
    - spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution.0.podAffinityTerm.labelSelector.matchLabels.queueManagerIdentity
