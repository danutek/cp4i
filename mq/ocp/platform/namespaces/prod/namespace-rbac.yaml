apiVersion: v1
kind: Namespace
metadata:
  name: mq-ocp-prod
  labels:
    argocd.argoproj.io/managed-by: openshift-gitops
    iic.example.org/environment: prod
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iic-mq-gitops
  namespace: mq-ocp-prod
rules:
- apiGroups:
  - mq.ibm.com
  resources:
  - queuemanagers
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iic-mq-gitops
  namespace: mq-ocp-prod
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iic-mq-gitops
