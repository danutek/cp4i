# ArgoCD RBAC — Namespace Admin
# Grants the ArgoCD application controller the admin ClusterRole in each
# namespace it manages. Without this, ArgoCD cannot create/update Jobs,
# Secrets, ConfigMaps, and other core resources in application namespaces.
#
# One RoleBinding per namespace — using the built-in admin ClusterRole so
# ArgoCD can manage any resource type the application overlays deploy.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-admin
  namespace: postgres-dev
  labels:
    app.kubernetes.io/part-of: streamsage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
---
