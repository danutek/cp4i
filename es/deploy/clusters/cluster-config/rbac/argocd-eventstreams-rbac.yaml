# ArgoCD RBAC — IBM Event Streams
# Grants the ArgoCD application controller permission to manage IBM Event Streams
# CRs (EventStreams, KafkaTopic, KafkaUser, KafkaBridge, KafkaConnect, KafkaMirrorMaker2).
# The built-in admin ClusterRole does not cover third-party operator API groups,
# so explicit ClusterRole rules are required.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-eventstreams-manager
  labels:
    app.kubernetes.io/part-of: streamsage
rules:
  - apiGroups:
      - eventstreams.ibm.com
    resources:
      - eventstreams
      - kafkatopics
      - kafkausers
      - kafkabridges
      - kafkaconnects
      - kafkaconnectors
      - kafkamirrormaker2s
      - kafkanodepools
      - kafkarebalances
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-eventstreams-manager
  labels:
    app.kubernetes.io/part-of: streamsage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-eventstreams-manager
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
