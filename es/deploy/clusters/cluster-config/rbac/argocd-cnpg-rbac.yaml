# ArgoCD RBAC — CloudNativePG
# Grants the ArgoCD application controller permission to manage CloudNativePG
# Cluster resources. Without this, ArgoCD cannot create/update PostgreSQL clusters.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-cnpg-manager
  labels:
    app.kubernetes.io/part-of: streamsage
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
      - backups
      - scheduledbackups
      - poolers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-cnpg-manager
  labels:
    app.kubernetes.io/part-of: streamsage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-cnpg-manager
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
