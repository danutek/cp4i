apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applies in order: namespace first, then OperatorGroup, then Subscription.
# OLM requires the namespace to exist before the OperatorGroup/Subscription.
resources:
  - ibm-eventstreams-namespace.yaml
  - ibm-eventstreams-operatorgroup.yaml
  - ibm-eventstreams-subscription.yaml
  - cloudnativepg-subscription.yaml
  - openshift-gitops-subscription.yaml
