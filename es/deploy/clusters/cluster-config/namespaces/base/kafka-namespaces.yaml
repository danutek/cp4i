kind: Namespace
apiVersion: v1
metadata:
  name: kafka-dev
  labels:
    kubernetes.io/metadata.name: kafka-dev
    environment: dev
    app.kubernetes.io/part-of: streamsage
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  annotations:
    openshift.io/display-name: "StreamSage — Kafka (dev)"
    openshift.io/description: "IBM Event Streams and supporting Kafka workloads — dev environment"
spec:
  finalizers:
    - kubernetes
