# streamsage-{env} namespaces — API gateway, services, console, AI workloads
# One Namespace per environment, 9 environments total.
---
kind: Namespace
apiVersion: v1
metadata:
  name: streamsage-dev
  labels:
    kubernetes.io/metadata.name: streamsage-dev
    environment: dev
    app.kubernetes.io/part-of: streamsage
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  annotations:
    openshift.io/display-name: "StreamSage — Services (dev)"
    openshift.io/description: "StreamSage application services — dev environment"
spec:
  finalizers:
    - kubernetes
