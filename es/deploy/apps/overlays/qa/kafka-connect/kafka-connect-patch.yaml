apiVersion: eventstreams.ibm.com/v1
kind: KafkaConnect
metadata:
  name: kafka-connect
  annotations:
    eventstreams.ibm.com/use-connector-resources: "true"
spec:
  replicas: 2
  bootstrapServers: kafka-es-kafka-bootstrap.kafka-qa.svc:9093
  config:
    group.id: kafka-connect-qa
    offset.storage.topic: connect-offsets-qa
    config.storage.topic: connect-configs-qa
    status.storage.topic: connect-status-qa
    offset.storage.replication.factor: 3
    config.storage.replication.factor: 3
    status.storage.replication.factor: 3
  resources:
    requests:
      memory: 2Gi
      cpu: "500m"
    limits:
      memory: 4Gi
      cpu: "1"

