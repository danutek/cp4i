apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamsage-console
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: console
          resources:
            requests:
              memory: "1536Mi"
              cpu: "1"
            limits:
              memory: "3Gi"
              cpu: "2"
          env:
            - name: ENVIRONMENT
              value: "perf"
            - name: API_URL
              value: "http://api-gateway.streamsage-perf.svc.cluster.local:8000"
            - name: LOG_LEVEL
              value: "info"
