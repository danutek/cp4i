apiVersion: eventstreams.ibm.com/v1
kind: KafkaConnect
metadata:
  name: kafka-connect
  annotations:
    eventstreams.ibm.com/use-connector-resources: "true"
spec:
  replicas: 3
  bootstrapServers: kafka-es-kafka-bootstrap.kafka-perf.svc:9093
  config:
    group.id: kafka-connect-perf
    offset.storage.topic: connect-offsets-perf
    config.storage.topic: connect-configs-perf
    status.storage.topic: connect-status-perf
    offset.storage.replication.factor: 3
    config.storage.replication.factor: 3
    status.storage.replication.factor: 3
  resources:
    requests:
      memory: 6Gi
      cpu: "1500m"
    limits:
      memory: 12Gi
      cpu: "3"
