apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamsage-console
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: streamsage-console
          image: quay.io/danutek_us/streamsage-console:0.1.0
          env:
            - name: API_URL
              value: http://api-gateway.streamsage-prod.svc.cluster.local:8000
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1
              memory: 1Gi
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: streamsage-console
spec:
  host: streamsage-console.apps.example.com
