apiVersion: eventstreams.ibm.com/v1
kind: EventStreams
metadata:
  name: es
spec:
  strimziOverrides:
    kafka:
      replicas: 5
      config:
        log.cleaner.threads: 6
        num.io.threads: 24
        num.network.threads: 9
        num.replica.fetchers: 3
      resources:
        requests:
          cpu: "8"
          memory: 32Gi
        limits:
          cpu: "8"
          memory: 32Gi