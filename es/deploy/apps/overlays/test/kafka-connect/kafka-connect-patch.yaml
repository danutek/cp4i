apiVersion: eventstreams.ibm.com/v1
kind: KafkaConnect
metadata:
  name: kafka-connect
  annotations:
    eventstreams.ibm.com/use-connector-resources: "true"
spec:
  replicas: 1
  bootstrapServers: kafka-es-kafka-bootstrap.kafka-test.svc:9093
  config:
    group.id: kafka-connect-test
    offset.storage.topic: connect-offsets-test
    config.storage.topic: connect-configs-test
    status.storage.topic: connect-status-test
    offset.storage.replication.factor: 1
    config.storage.replication.factor: 1
    status.storage.replication.factor: 1
  resources:
    requests:
      memory: 2Gi
      cpu: "500m"
    limits:
      memory: 4Gi
      cpu: "1"
