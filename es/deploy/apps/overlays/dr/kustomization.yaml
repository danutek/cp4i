# deploy/apps/overlays/dr/kustomization.yaml
#
# This file is intentionally not a Kustomization resource entry point.
# The dr environment uses per-component subdirectories, each with their own
# kustomization.yaml. ArgoCD ApplicationSets discover each component separately:
#
#   dr/event-streams/       ← managed by event-streams-appset.yaml
#   dr/kafka-connect/       ← managed by kafka-connect-appset.yaml
#   dr/kafka-topics/        ← managed by kafka-topics-appset.yaml
#   dr/kafka-users/         ← managed by kafka-users-appset.yaml
#   dr/kafka-bridge/        ← managed by kafka-bridge-appset.yaml
#   dr/mm2/                 ← managed by mirrormaker2-appset.yaml (DR only)
#   dr/monitoring/          ← managed by kafka-monitoring-appset.yaml
#   dr/network-policies/    ← managed by network-policies-appset.yaml
#   dr/streamsage-services/ ← managed by streamsage-services-appset.yaml
#   dr/streamsage-console/  ← managed by streamsage-console-appset.yaml
#
# To validate a single component locally:
#   oc kustomize deploy/apps/overlays/dr/event-streams
