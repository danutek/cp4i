apiVersion: eventstreams.ibm.com/v1
kind: EventStreams
metadata:
  name: es
spec:
  strimziOverrides:
    kafka:
      replicas: 1
      config:
        log.cleaner.threads: 6
        num.io.threads: 24
        num.network.threads: 9
        num.replica.fetchers: 3
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 8Gi