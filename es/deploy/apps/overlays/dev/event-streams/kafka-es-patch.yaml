apiVersion: eventstreams.ibm.com/v1
kind: EventStreams
metadata:
  name: kafka-es
spec:
  version: latest
  license:
    accept: true
    license: L-CYBH-K48BZQ
    use: EventAutomationNonProduction
  strimziOverrides:
    kafka:
      authorization:
        type: simple
      listeners:
        - name: plain
          port: 9092
          type: internal
          tls: false
          authentication:
            type: scram-sha-512
        - name: tls
          port: 9093
          type: internal
          tls: true
          authentication:
            type: scram-sha-512
      config:
        offsets.topic.replication.factor: 1
        transaction.state.log.replication.factor: 1
        transaction.state.log.min.isr: 1
        default.replication.factor: 1
        min.insync.replicas: 1
        # KRaft quorum formation — give brokers enough time to complete mTLS
        # handshakes before election timeout fires.  These values only apply
        # during the initial cluster boot; steady-state performance is unaffected.
        controller.quorum.election.timeout.ms: 10000
        controller.quorum.fetch.timeout.ms: 10000
        controller.quorum.request.timeout.ms: 10000
        # Reduce NetworkClient reconnect backoff so brokers re-attempt port 9090
        # quickly after a Connection-Refused during staggered startup.
        reconnect.backoff.ms: 100
        reconnect.backoff.max.ms: 1000
    nodePools:
      - name: kafka
        replicas: 3
        storage:
          type: ephemeral
        roles:
          - broker
          - controller
        resources:
          requests:
            memory: 1Gi
            cpu: "250m"
          limits:
            memory: 2Gi
            cpu: "2"