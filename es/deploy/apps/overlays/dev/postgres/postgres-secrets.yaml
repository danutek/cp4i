# DEV POC ONLY — plain-text secrets for CloudNativePG.
#
# streamsage-db-superuser:
#   ArgoCD manages this secret so CNPG can read the superuser password.
#   The password must match what was set via ALTER USER postgres PASSWORD.
#   sync-wave "1" ensures it exists before the Cluster (wave 5).
#
# streamsage-db-app-credentials:
#   INPUT secret read by spec.managed.roles to set the streamsage app-user password.
#   CNPG reads it; we own this name (not CNPG).
#
# ⚠️  REPLACE with SealedSecrets before promoting beyond dev.
#
---
apiVersion: v1
kind: Secret
metadata:
  name: streamsage-db-superuser
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: prevault-superuser-dev
---
apiVersion: v1
kind: Secret
metadata:
  name: streamsage-db-app-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: kubernetes.io/basic-auth
stringData:
  username: streamsage
  password: prevault-app-dev
