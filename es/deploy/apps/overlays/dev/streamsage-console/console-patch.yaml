apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamsage-console
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: streamsage-console
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: ENVIRONMENT
              value: "dev"
            - name: API_URL
              value: "http://api-gateway.streamsage-dev.svc.cluster.local:8000"


