apiVersion: eventstreams.ibm.com/v1
kind: KafkaConnect
metadata:
  name: kafka-connect
  annotations:
    eventstreams.ibm.com/use-connector-resources: "true"
spec:
  replicas: 3
  bootstrapServers: kafka-es-kafka-bootstrap.kafka-eem.svc:9093
  config:
    group.id: kafka-connect-eem
    offset.storage.topic: connect-offsets-eem
    config.storage.topic: connect-configs-eem
    status.storage.topic: connect-status-eem
    offset.storage.replication.factor: 3
    config.storage.replication.factor: 3
    status.storage.replication.factor: 3
  resources:
    requests:
      memory: 4Gi
      cpu: "1"
    limits:
      memory: 8Gi
      cpu: "2"
