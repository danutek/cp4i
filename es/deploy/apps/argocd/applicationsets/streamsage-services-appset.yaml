# Project: StreamSage Intelligent Transaction Processing Platform
# Created: 2026-03-22
# Purpose: ArgoCD ApplicationSet for StreamSage Backend Services automated deployment

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: streamsage-services
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: streamsage
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.ibm.com/danutek/StreamSage.git
        revision: HEAD
        directories:
          - path: deploy/apps/overlays/*/streamsage-services
          - path: deploy/apps/overlays/test/streamsage-services
            exclude: true
          - path: deploy/apps/overlays/qa/streamsage-services
            exclude: true
          - path: deploy/apps/overlays/staging/streamsage-services
            exclude: true
          - path: deploy/apps/overlays/eem/streamsage-services
            exclude: true
          - path: deploy/apps/overlays/ep/streamsage-services
            exclude: true
          - path: deploy/apps/overlays/perf/streamsage-services
            exclude: true
          - path: deploy/apps/overlays/prod/streamsage-services
            exclude: true
          - path: deploy/apps/overlays/dr/streamsage-services
            exclude: true
  template:
    metadata:
      name: '{{index .path.segments 3}}-streamsage-services'
      labels:
        environment: '{{index .path.segments 3}}'
        component: streamsage-services
        managed-by: argocd
        app.kubernetes.io/part-of: streamsage
    spec:
      project: default
      source:
        repoURL: https://github.ibm.com/danutek/StreamSage.git
        targetRevision: HEAD
        path: 'deploy/apps/overlays/{{index .path.segments 3}}/streamsage-services'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'streamsage-{{index .path.segments 3}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

