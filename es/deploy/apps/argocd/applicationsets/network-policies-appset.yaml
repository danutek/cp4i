# Project: StreamSage Intelligent Transaction Processing Platform
# Purpose: ArgoCD ApplicationSet for Network Policies (zero-trust enforcement)

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: network-policies
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: streamsage
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.ibm.com/danutek/StreamSage.git
        revision: HEAD
        directories:
          - path: deploy/apps/overlays/*/network-policies
          - path: deploy/apps/overlays/test/network-policies
            exclude: true
          - path: deploy/apps/overlays/qa/network-policies
            exclude: true
          - path: deploy/apps/overlays/staging/network-policies
            exclude: true
          - path: deploy/apps/overlays/eem/network-policies
            exclude: true
          - path: deploy/apps/overlays/ep/network-policies
            exclude: true
          - path: deploy/apps/overlays/perf/network-policies
            exclude: true
          - path: deploy/apps/overlays/prod/network-policies
            exclude: true
          - path: deploy/apps/overlays/dr/network-policies
            exclude: true
  template:
    metadata:
      name: '{{index .path.segments 3}}-network-policies'
      labels:
        environment: '{{index .path.segments 3}}'
        component: network-policies
        managed-by: argocd
        app.kubernetes.io/part-of: streamsage
    spec:
      project: default
      source:
        repoURL: https://github.ibm.com/danutek/StreamSage.git
        targetRevision: HEAD
        path: 'deploy/apps/overlays/{{index .path.segments 3}}/network-policies'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'kafka-{{index .path.segments 3}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=false
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      ignoreDifferences:
        - group: networking.k8s.io
          kind: NetworkPolicy
          jsonPointers:
            - /metadata/generation
