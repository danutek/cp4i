# Project: StreamSage Intelligent Transaction Processing Platform
# Created: 2026-03-21
# Purpose: ArgoCD ApplicationSet for Event Streams automated deployment

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: event-streams
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: streamsage
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.ibm.com/danutek/StreamSage.git
        revision: HEAD
        directories:
          - path: deploy/apps/overlays/*/event-streams
          - path: deploy/apps/overlays/test/event-streams
            exclude: true
          - path: deploy/apps/overlays/qa/event-streams
            exclude: true
          - path: deploy/apps/overlays/staging/event-streams
            exclude: true
          - path: deploy/apps/overlays/eem/event-streams
            exclude: true
          - path: deploy/apps/overlays/ep/event-streams
            exclude: true
          - path: deploy/apps/overlays/perf/event-streams
            exclude: true
          - path: deploy/apps/overlays/prod/event-streams
            exclude: true
          - path: deploy/apps/overlays/dr/event-streams
            exclude: true
  template:
    metadata:
      name: '{{index .path.segments 3}}-event-streams'
      labels:
        environment: '{{index .path.segments 3}}'
        component: event-streams
        managed-by: argocd
        app.kubernetes.io/part-of: streamsage
    spec:
      project: default
      source:
        repoURL: https://github.ibm.com/danutek/StreamSage.git
        targetRevision: HEAD
        path: 'deploy/apps/overlays/{{index .path.segments 3}}/event-streams'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'kafka-{{index .path.segments 3}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=false
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      ignoreDifferences:
        - group: eventstreams.ibm.com
          kind: EventStreams
          jsonPointers:
            - /status
        - group: kafka.strimzi.io
          kind: Kafka
          jsonPointers:
            - /status


