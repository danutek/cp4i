# Project: StreamSage Intelligent Transaction Processing Platform
# Purpose: ArgoCD ApplicationSet for Kafka monitoring (PodMonitor + metrics ConfigMap)

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kafka-monitoring
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: streamsage
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.ibm.com/danutek/StreamSage.git
        revision: HEAD
        directories:
          - path: deploy/apps/overlays/*/monitoring
          - path: deploy/apps/overlays/test/monitoring
            exclude: true
          - path: deploy/apps/overlays/qa/monitoring
            exclude: true
          - path: deploy/apps/overlays/staging/monitoring
            exclude: true
          - path: deploy/apps/overlays/eem/monitoring
            exclude: true
          - path: deploy/apps/overlays/ep/monitoring
            exclude: true
          - path: deploy/apps/overlays/perf/monitoring
            exclude: true
          - path: deploy/apps/overlays/prod/monitoring
            exclude: true
          - path: deploy/apps/overlays/dr/monitoring
            exclude: true
  template:
    metadata:
      name: '{{index .path.segments 3}}-kafka-monitoring'
      labels:
        environment: '{{index .path.segments 3}}'
        component: monitoring
        managed-by: argocd
        app.kubernetes.io/part-of: streamsage
    spec:
      project: default
      source:
        repoURL: https://github.ibm.com/danutek/StreamSage.git
        targetRevision: HEAD
        path: 'deploy/apps/overlays/{{index .path.segments 3}}/monitoring'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'kafka-{{index .path.segments 3}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=false
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
