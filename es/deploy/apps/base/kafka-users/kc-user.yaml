apiVersion: eventstreams.ibm.com/v1
kind: KafkaUser
metadata:
  name: kc-user
  labels:
    eventstreams.ibm.com/cluster: kafka-es
    backup.eventstreams.ibm.com/component: kafkauser
    app.kubernetes.io/part-of: streamsage
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - host: '*'
        operations:
          - Read
          - Write
          - Create
        resource:
          name: '*'
          patternType: literal
          type: topic
      - host: '*'
        operations:
          - Read
          - Alter
        resource:
          name: __schema_
          patternType: prefix
          type: topic
      - host: '*'
        operations:
          - Read
        resource:
          name: '*'
          patternType: literal
          type: group
