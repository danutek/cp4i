# Project: StreamSage Intelligent Transaction Processing Platform
# Created: 2026-03-21
# Purpose: Kustomization for NetworkPolicies - Zero-trust network security

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - default-deny-all.yaml
  - kafka-broker-netpol.yaml
  - kafka-connect-netpol.yaml
  - kafka-bridge-netpol.yaml
  - mirrormaker2-netpol.yaml
  - grafana-netpol.yaml
