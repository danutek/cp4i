apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-policy
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: streamsage
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow from OpenShift Router (for external access)
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 3000  # Grafana UI
    # Allow from internal pods (admin access)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000

  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow to Prometheus
    - to:
        - namespaceSelector:
            matchLabels:
              name: openshift-monitoring
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9091
    # Allow to Kafka brokers for metrics scraping
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/kind: Kafka
      ports:
        - protocol: TCP
          port: 9404
    # Allow to Kafka Connect for metrics
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/kind: KafkaConnect
      ports:
        - protocol: TCP
          port: 9404
    # Allow to Kafka Bridge for metrics
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/kind: KafkaBridge
      ports:
        - protocol: TCP
          port: 9404
