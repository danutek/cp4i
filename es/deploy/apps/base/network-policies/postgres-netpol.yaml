# Project: StreamSage Intelligent Transaction Processing Platform
# Created: 2026-03-21
# Purpose: NetworkPolicy for PostgreSQL database isolation

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  labels:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: streamsage
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    # Allow from StreamSage services
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: streamsage
      ports:
        - protocol: TCP
          port: 5432
    
    # Allow from Kafka Connect (for JDBC sink)
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/kind: KafkaConnect
      ports:
        - protocol: TCP
          port: 5432
    
    # Allow from monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              name: openshift-monitoring
      ports:
        - protocol: TCP
          port: 9187  # Postgres exporter metrics
  
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    
    # Allow to other PostgreSQL instances (for replication)
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432


