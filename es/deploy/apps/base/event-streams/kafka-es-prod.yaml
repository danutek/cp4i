apiVersion: eventstreams.ibm.com/v1
kind: EventStreams
metadata:
  name: minimal-prod
  labels:
    backup.eventstreams.ibm.com/component: eventstreams
  namespace: kafka
spec:
  license:
    accept: true
    license: L-CYBH-K48BZQ
    use: EventAutomationProduction
  strimziOverrides:
    kafka:
      config:
        log.cleaner.threads: 6
        num.io.threads: 24
        num.network.threads: 9
        num.replica.fetchers: 3
        offsets.topic.replication.factor: 3
        default.replication.factor: 3
        min.insync.replicas: 2
        auto.create.topics.enable: 'false'
      metricsConfig:
        valueFrom:
          configMapKeyRef:
            key: kafka-metrics-config.yaml
            name: minimal-prod-metrics-config
        type: jmxPrometheusExporter
      authorization:
        type: simple
      listeners:
        - authentication:
            type: scram-sha-512
          name: external
          port: 9094
          type: route
          tls: true
        - authentication:
            type: tls
          name: tls
          port: 9093
          type: internal
          tls: true
    nodePools:
      - resources:
          limits:
            memory: 2048Mi
            cpu: 1000m
          requests:
            memory: 128Mi
            cpu: 100m
        storage:
          type: persistent-claim
          size: 2Gi
        roles:
          - broker
        name: kafka
        replicas: 3
      - storage:
          type: persistent-claim
          size: 2Gi
        roles:
          - controller
        name: controller
        replicas: 3
  adminUI:
    authentication:
      - type: integrationKeycloak
  restProducer: {}
  apicurioRegistry: {}
  adminApi: {}
  collector: {}
  version: latest
