apiVersion: eventstreams.ibm.com/v1
kind: EventStreams
metadata:
  name: kafka-es
  labels:
    backup.eventstreams.ibm.com/component: eventstreams
spec:
  version: latest
  license:
    accept: true
    license: L-CYBH-K48BZQ
    use: EventAutomationNonProduction
  adminApi: {}
  adminUI:
    authentication:
      - type: scram-sha-512
  apicurioRegistry: {}
  collector: {}
  restProducer: {}
  strimziOverrides:
    kafka:
      authorization:
        type: simple
      config:
        offsets.topic.replication.factor: 1
        transaction.state.log.min.isr: 1
        transaction.state.log.replication.factor: 1
        auto.create.topics.enable: 'false'
      listeners:
        - name: plain
          port: 9092
          type: internal
          tls: false
          authentication:
            type: scram-sha-512
        - name: tls
          port: 9093
          type: internal
          tls: true
          authentication:
            type: scram-sha-512
      metricsConfig:
        type: jmxPrometheusExporter
        valueFrom:
          configMapKeyRef:
            key: kafka-metrics-config.yaml
            name: kafka-es-metrics
    nodePools:
      - name: kafka
        replicas: 1
        storage:
          type: ephemeral
        roles:
          - broker
          - controller
