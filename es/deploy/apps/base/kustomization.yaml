apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This is the root base kustomization — useful for full-base validation
# (e.g. `oc kustomize deploy/apps/base`).
# ArgoCD ApplicationSets do NOT use this file directly — each ApplicationSet
# points its generator at the per-component overlay subdirectory.

resources:
  # Kafka / Event Streams platform
  - event-streams
  - kafka-connect
  - kafka-connectors
  - kafka-topics
  - kafka-users
  - kafka-bridge
  - mm2

  # Observability & Security
  - monitoring
  - network-policies

  # Data tier
  - postgres

  # Application services
  - streamsage-services
  - streamsage-console

  # Stub directories — not yet implemented, excluded until populated:
  # - cruise-control
  # - rbac
  # - schema-registry

commonLabels:
  app.kubernetes.io/part-of: streamsage
  app.kubernetes.io/managed-by: argocd
