apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: streamsage
data:
  # Kafka (non-sensitive config — credentials come from api-gateway-secrets)
  KAFKA_BOOTSTRAP_SERVERS: "kafka-es-kafka-bootstrap.kafka-dev.svc:9092"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-512"
  # Service config
  LOG_LEVEL: "INFO"
  SERVICE_HOST: "0.0.0.0"
  SERVICE_PORT: "8000"
  ENVIRONMENT: "dev"
  # Auth
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
