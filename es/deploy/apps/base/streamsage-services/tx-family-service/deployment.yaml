apiVersion: apps/v1
kind: Deployment
metadata:
  name: tx-family-service
  labels:
    app: tx-family-service
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tx-family-service
  template:
    metadata:
      labels:
        app: tx-family-service
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: tx-family-service
        image: quay.io/danutek_us/streamsage-tx-family-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tx-family-service-secrets
              key: DATABASE_URL
        envFrom:
        - configMapRef:
            name: tx-family-service-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
