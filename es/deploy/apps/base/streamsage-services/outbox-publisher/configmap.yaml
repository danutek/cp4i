apiVersion: v1
kind: ConfigMap
metadata:
  name: outbox-publisher-config
  labels:
    app: outbox-publisher
    app.kubernetes.io/part-of: streamsage
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka-es-kafka-bootstrap.kafka-dev.svc:9092"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "SCRAM-SHA-512"
  POLL_INTERVAL_SECONDS: "5"
  BATCH_SIZE: "100"
  MAX_RETRY_ATTEMPTS: "5"
  RETRY_BACKOFF_SECONDS: "60"
  LOG_LEVEL: "INFO"
