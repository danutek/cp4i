apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamsage-console
  labels:
    app.kubernetes.io/name: streamsage-console
    app.kubernetes.io/part-of: streamsage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streamsage-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamsage-console
        app.kubernetes.io/part-of: streamsage
    spec:
      containers:
        - name: streamsage-console
          image: quay.io/danutek_us/streamsage-console:0.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            - name: API_URL
              value: http://localhost:8000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
