apiVersion: eventstreams.ibm.com/v1
kind: KafkaConnect
metadata:
  name: kafka-connect
  labels:
    backup.eventstreams.ibm.com/component: kafkaconnect
    app.kubernetes.io/part-of: streamsage
  annotations:
    eventstreams.ibm.com/use-connector-resources: 'true'
spec:
  template:
    connectContainer:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
    pod:
      metadata:
        annotations:
          # Default: non-production. Production-tier overlays (staging/prod/ep) patch these.
          eventstreams.production.type: CloudPakForIntegrationNonProduction
          productID: 2a79e49111f44ec3acd89608e56138f5
          productName: IBM Event Streams for Non Production
          productVersion: 12.2.0
          productMetric: VIRTUAL_PROCESSOR_CORE
          productChargedContainers: All
          cloudpakId: c8b82d189e7545f0892db9ef2731b90d
          cloudpakName: IBM Cloud Pak for Integration
          productCloudpakRatio: '2:1'
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
                      - s390x
                      - ppc64le
  tls:
    trustedCertificates:
      - certificate: ca.crt
  config:
    group.id: connect-cluster
    offset.storage.topic: connect-cluster-offsets
    config.storage.topic: connect-cluster-configs
    status.storage.topic: connect-cluster-status
