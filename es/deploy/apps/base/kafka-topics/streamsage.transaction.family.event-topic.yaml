apiVersion: eventstreams.ibm.com/v1
kind: KafkaTopic
metadata:
  name: streamsage.transaction.family.event
  namespace: kafka
  finalizers:
    - eventstreams.ibm.com/topic-operator
  labels:
    app.kubernetes.io/instance: kafka-es
    backup.eventstreams.ibm.com/component: kafkatopic
    eventstreams.ibm.com/cluster: kafka-es
spec:
  config:
    message.timestamp.before.max.ms: '9007199254740991'
    preallocate: 'false'
    segment.ms: '604800000'
    file.delete.delay.ms: '60000'
    compression.type: producer
    min.cleanable.dirty.ratio: '0.5'
    min.insync.replicas: '1'
    segment.jitter.ms: '0'
    min.compaction.lag.ms: '0'
    flush.ms: '9007199254740991'
    segment.bytes: '1073741824'
    unclean.leader.election.enable: 'false'
    segment.index.bytes: '10485760'
    flush.messages: '9007199254740991'
    retention.ms: '86400000'
    local.retention.bytes: '-2'
    local.retention.ms: '-2'
    message.timestamp.type: CreateTime
    delete.retention.ms: '86400000'
    max.message.bytes: '1000012'
    retention.bytes: '-1'
    cleanup.policy: delete
    index.interval.bytes: '4096'
    remote.storage.enable: 'false'
  partitions: 1
  replicas: 1
  topicName: streamsage.transaction.family.event


