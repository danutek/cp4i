apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-connect-metrics
  labels:
    app: mirrormaker2
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: streamsage
data:
  kafka-connect-metrics-config.yaml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
    # Kafka Connect Worker Metrics
    - pattern: "kafka.connect<type=connect-worker-metrics>([^:]+):"
      name: kafka_connect_worker_$1
      type: GAUGE

    - pattern: "kafka.connect<type=connect-worker-metrics, connector=([^,]+)><>([^:]+)"
      name: kafka_connect_worker_connector_$2
      labels:
        connector: "$1"
      type: GAUGE

    - pattern: "kafka.connect<type=connect-worker-rebalance-metrics>([^:]+):"
      name: kafka_connect_worker_rebalance_$1
      type: GAUGE

    # Connector Metrics
    - pattern: "kafka.connect<type=connector-metrics, connector=([^,]+)><>([^:]+)"
      name: kafka_connect_connector_$2
      labels:
        connector: "$1"
      type: GAUGE

    # Task Metrics
    - pattern: "kafka.connect<type=([^,]+)-task-metrics, connector=([^,]+), task=([^,]+)><>([^:]+)"
      name: kafka_connect_$1_task_$4
      labels:
        connector: "$2"
        task: "$3"
      type: GAUGE

    # Source Task Metrics
    - pattern: "kafka.connect<type=source-task-metrics, connector=([^,]+), task=([^,]+)><>([^:]+)"
      name: kafka_connect_source_task_$3
      labels:
        connector: "$1"
        task: "$2"
      type: GAUGE

    # Sink Task Metrics
    - pattern: "kafka.connect<type=sink-task-metrics, connector=([^,]+), task=([^,]+)><>([^:]+)"
      name: kafka_connect_sink_task_$3
      labels:
        connector: "$1"
        task: "$2"
      type: GAUGE

    # Task Error Metrics
    - pattern: "kafka.connect<type=task-error-metrics, connector=([^,]+), task=([^,]+)><>([^:]+)"
      name: kafka_connect_task_error_$3
      labels:
        connector: "$1"
        task: "$2"
      type: GAUGE

    # Kafka Producer Metrics
    - pattern: "kafka.producer<type=producer-metrics, client-id=([^,]+)><>([^:]+)"
      name: kafka_producer_$2
      labels:
        client_id: "$1"
      type: GAUGE

    # Kafka Consumer Metrics
    - pattern: "kafka.consumer<type=consumer-metrics, client-id=([^,]+)><>([^:]+)"
      name: kafka_consumer_$2
      labels:
        client_id: "$1"
      type: GAUGE

    # JVM Memory Metrics
    - pattern: "java.lang<type=Memory><HeapMemoryUsage>([^:]+)"
      name: jvm_memory_heap_$1
      type: GAUGE

    - pattern: "java.lang<type=Memory><NonHeapMemoryUsage>([^:]+)"
      name: jvm_memory_nonheap_$1
      type: GAUGE

    # JVM GC Metrics
    - pattern: "java.lang<type=GarbageCollector, name=([^,]+)><>CollectionCount"
      name: jvm_gc_collection_count
      labels:
        gc: "$1"
      type: COUNTER

    - pattern: "java.lang<type=GarbageCollector, name=([^,]+)><>CollectionTime"
      name: jvm_gc_collection_time_ms
      labels:
        gc: "$1"
      type: COUNTER

    # JVM Thread Metrics
    - pattern: "java.lang<type=Threading><>ThreadCount"
      name: jvm_threads_current
      type: GAUGE

    - pattern: "java.lang<type=Threading><>DaemonThreadCount"
      name: jvm_threads_daemon
      type: GAUGE
