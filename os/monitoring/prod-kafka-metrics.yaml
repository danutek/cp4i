apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-kafka-metrics
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka-metrics
    app.kubernetes.io/part-of: event-streams
    environment: prod
data:
  kafka-metrics-config.yaml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      - pattern: 'kafka.controller<type=KafkaController, name=ActiveControllerCount><>Value'
        name: kafka_controller_activecontrollercount
        type: GAUGE

      - pattern: 'kafka.controller<type=KafkaController, name=OfflinePartitionsCount><>Value'
        name: kafka_controller_offlinepartitionscount
        type: GAUGE

      - pattern: 'kafka.server<type=ReplicaManager, name=UnderReplicatedPartitions><>Value'
        name: kafka_server_underreplicatedpartitions
        type: GAUGE

      - pattern: 'kafka.server<type=ReplicaManager, name=UnderMinIsrPartitionCount><>Value'
        name: kafka_server_underminisrpartitioncount
        type: GAUGE

      - pattern: 'kafka.server<type=BrokerTopicMetrics, name=MessagesInPerSec><>Count'
        name: kafka_server_messagesin_total
        type: COUNTER

      - pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesInPerSec><>Count'
        name: kafka_server_bytesin_total
        type: COUNTER

      - pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesOutPerSec><>Count'
        name: kafka_server_bytesout_total
        type: COUNTER

      - pattern: 'kafka.network<type=RequestMetrics, name=ErrorsPerSec, request=(.+)><>Count'
        name: kafka_network_request_errors_total
        type: COUNTER
        labels:
          request: "$1"

      - pattern: 'java.lang<type=Memory><HeapMemoryUsage>used'
        name: jvm_memory_used_bytes
        type: GAUGE

      - pattern: 'java.lang<type=GarbageCollector, name=(.+)><>CollectionCount'
        name: jvm_gc_collection_total
        type: COUNTER
        labels:
          gc: "$1"
