apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prod-kafka-metrics
  namespace: kafka
  labels:
    team: event-streams
    environment: prod
spec:
  selector:
    matchLabels:
      app: prod-kafka-metrics
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
